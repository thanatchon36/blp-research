[project]
name = "blp-research"
version = "0.1.1"
description = "Text-based regional indicators from Business Liaison Program notes and a grounded report-drafting assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
thai = ["pythainlp>=5.0"]                   # Thai word segmentation (falls back to character bigrams)
llm = ["requests>=2.31", "anthropic>=0.40"] # on-premise endpoint; Claude API only with approved, anonymized data
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
